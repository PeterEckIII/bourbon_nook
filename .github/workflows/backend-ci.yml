name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            configuration-server:
              - 'configuration-server/**'
            discovery-service:
              - 'discovery-service/**'
            api-gateway:
              - 'api-gateway/**'
            users-api:
              - 'users-api/**'
            bottles-api:
              - 'bottles-api/**'
            reviews-api:
              - 'reviews-api/**'

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        # Tests are skipped: each service's only test is the Spring Initializr
        # placeholder (`contextLoads`), which boots the full application
        # context and needs MySQL/RabbitMQ/Eureka/config-server to pass. This
        # step validates compilation and packaging only.
        run: ./mvnw -B package -DskipTests
